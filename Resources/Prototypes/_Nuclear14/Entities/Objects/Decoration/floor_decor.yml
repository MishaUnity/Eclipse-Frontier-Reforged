- type: entity
  id: DecorFloorBase
  name: base floor decor
  abstract: true
  placement:
    mode: PlaceFree
  components:
    - type: Transform
    - type: Physics
      bodyType: Static
    - type: Sprite
      sprite: _Nuclear14/Structures/Decoration/cave_decor.rsi
    - type: Damageable
    - type: Injurable
      damageContainer: StructuralInorganic
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: Clickable

- type: entity
  id: DecorFloorStalagmiteBase
  parent: DecorFloorBase
  name: base stalagmite
  suffix: floor decor
  abstract: true
  components:
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 5
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: GlassBreak

