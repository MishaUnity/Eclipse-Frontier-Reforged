- type: entity
  id: DecorFloorSupport
  parent: DecorFloorBase
  name: wooden support
  suffix: floor decor
  components:
    - type: Sprite
      state: support
    - type: MeleeSound
      soundGroups:
        Brute:
          path: /Audio/Effects/chop.ogg
          params:
            variation: 0.05
    - type: Destructible
      thresholds:
        - trigger:
            # Excess damage, don't spawn entities
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger: !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:SpawnEntitiesBehavior
              spawn:
                Log:
                  min: 1
                  max: 3

