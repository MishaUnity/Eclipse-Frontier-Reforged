# Base Diagonal Wall
- type: entity
  parent: BaseStructureWall
  id: BaseWallDiagonal
  abstract: true
  name: basewall
  suffix: Diagonal
  placement:
    mode: SnapgridCenter
    snap:
      - Wall
  components:
    - type: Tag
      tags:
        - Wall
        - Diagonal
    - type: IconSmooth
      mode: Diagonal
      key: walls
      base: state
    - type: Airtight
      noAirWhenFullyAirBlocked: false
      airBlockedDirection:
        - South
        - East
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PolygonShape
            vertices:
              - "-0.5,-0.5"
              - "0.5,0.5"
              - "0.5,-0.5"
          mask:
            - FullTileMask
          layer:
            - FullTileLayerInteract
        fix_bottom:
          shape: !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,-0.46"
          mask:
          - InteractImpassable
          layer:
          - InteractImpassable
        fix_right:
          shape: !type:PhysShapeAabb
            bounds: "0.46,-0.5,0.5,0.5"
          mask:
          - InteractImpassable
          layer:
          - InteractImpassable
    - type: Occluder
      enabled: false

- type: entity
  id: WallShuttleDiagonal
  parent: [BaseWallDiagonal, WallShuttle]
  name: shuttle wall
  components:
    - type: Sprite
      drawdepth: Walls
      sprite: Structures/Walls/shuttle_diagonal.rsi
      state: state0
    - type: Icon
      sprite: Structures/Walls/shuttle_diagonal.rsi
      state: state0
    - type: Construction
      graph: Girder
      node: diagonalshuttleWall

- type: entity
  id: WallPlastitaniumDiagonalIndestructible
  parent: [BaseWallDiagonal, WallPlastitaniumIndestructible]
  name: plastitanium wall
  suffix: Diagonal, Indestructible
  components:
    - type: Sprite
      drawdepth: Walls
      sprite: Structures/Walls/plastitanium_diagonal.rsi
      state: state0
    - type: Icon
      sprite: Structures/Walls/plastitanium_diagonal.rsi
      state: state0

- type: entity
  id: WallPlastitaniumDiagonal
  parent: WallPlastitaniumDiagonalIndestructible
  name: plastitanium wall
  components:
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1000
        behaviors:
          - !type:SpawnEntitiesBehavior
            spawn:
              Girder:
                min: 1
                max: 1
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalSlam

