- type: entity
  id: SpawnPoIRule
  parent: BaseGameRule
  components:
  - type: SpawnPoIRule

- type: entity
  id: DefaultSpawnPoIRule
  parent: SpawnPoIRule
  components:
  - type: SpawnPoIRule
    randomSpawnGroups:
      trade:
        - mapId: PoITradeMall
          minOriginDistance: 500
          maxOriginDistance: 1000

- type: entity
  id: InitSectorsRule
  parent: BaseGameRule
  components:
  - type: InitSectorsRule
    position: !type:DefaultSectorPositionGenerator
    content:
    - !type:FrontierSectorGenerator
      map: FrontierSystem
    - !type:StargateSectorGenerator
      group:
        - PoIStargate